<html>
<head>
    <title>My Lists</title>
</head>
<body>

    <!-- A. Unordered List -->
    <h2>Favorite Foods</h2>
    <ul>
        <li>Coke</li>
        <li>Sprite</li>
        <li>Royal</li>
        <li>Pepsi</li>

    <ol>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
        <li>PHP</li>
        <li>C#</li>

    <!-- C. Nested List -->
    <h2>Computer Science</h2>
    <ul>
        </ul>Programmer
            <ul>
                <li>Java</li>

                <li>PHP</li>

        </li>

        <li>Web Development

                <li>HTML</li>

                <li>JavaScript</li>
            </ul>
        </li>
    </ul>

</body>
</html>
